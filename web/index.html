<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Coordinator: instant poster, painted before any JS. Fades on window event 'stage:ready' (fallback 12 s). -->
    <style>
      html,body{background:#0B0B12}
      #poster{position:fixed;inset:0;z-index:2147483000;overflow:hidden;pointer-events:none;
        background:radial-gradient(130% 90% at 50% 0%,rgba(45,75,255,.62),rgba(122,92,255,.30) 42%,#0B0B12 78%) #0B0B12;
        transition:opacity .8s ease,visibility .8s ease}
      #poster.gone{opacity:0;visibility:hidden}
      #poster .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
      #poster .contain{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
      #poster .portrait{position:absolute;left:50%;bottom:0;height:94%;width:auto;max-width:96%;object-fit:contain;transform:translateX(-50%);opacity:0;transition:opacity .35s ease}
      #poster img.in{opacity:1}
      #poster .name{position:absolute;left:0;right:0;top:9%;text-align:center;font-family:Anton,Impact,'Arial Narrow',sans-serif;font-size:min(13vw,17vh);line-height:.9;letter-spacing:.01em;color:rgba(243,238,230,.16);white-space:nowrap}
      #poster .sub{position:absolute;left:0;right:0;top:calc(9% + min(13vw,17vh));text-align:center;font:700 min(1.6vw,12px)/1.4 'Space Mono',ui-monospace,monospace;letter-spacing:.22em;color:rgba(243,238,230,.55)}
      #poster .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 85%}
      /* persona framing: in the 1280x720 clip he spans y 230-650 around x 640; keep him head to toe in any frame */
      @media (max-aspect-ratio: 1/1){#poster .vid{transform:scale(1.71);transform-origin:50% 77%}}
      @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 3/2){#poster .vid{transform:scale(1.35);transform-origin:50% 62%}}
      #poster.persona{background:#0B0B12 url(/brand/hero-walk.jpg) 50% 85%/cover no-repeat}
      #poster.playing .tag,#poster.playing .bar{display:none}
      #poster .tag{position:absolute;left:18px;bottom:16px;font:700 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.2em;color:#F3EEE6;opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.6)}
      #poster .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,#2D4BFF,#7A5CFF);transform-origin:left;transform:scaleX(0);animation:posterbar 9s cubic-bezier(.2,.7,.2,1) forwards}
      @keyframes posterbar{to{transform:scaleX(.94)}}
      @media (prefers-reduced-motion:reduce){#poster .bar{animation:none;transform:scaleX(.6)}}
    </style>
    <title>SHOP-UNI-FY · Stage</title>
  </head>
  <body>
    <div id="poster" aria-hidden="true"></div>
    <script>
      (function () {
        var p = document.getElementById('poster'), q = new URLSearchParams(location.search), path = location.pathname
        if (/^\/(bag|checkout|orders|store)/.test(path)) { p.remove(); return }
        var h, keep = false
        var DEF = 'KK-001,KT-002,KT-006,LL-006,SH-001,SW-001'
        var NAME = '<div class="name">HRISHIKESH HUNDEKARI</div><div class="sub">SHOP-UNI-FY · SMALL BUSINESS AI BUILDER TOUR · BENGALURU</div>'
        function cut(k) { return '<img class="portrait" src="/looks/' + k + '.webp" data-fb="/looks/' + DEF + '.webp" alt="">' }
        if (path.indexOf('/product') === 0) {
          var sku = (q.get('sku') || '').replace(/[^A-Za-z0-9-]/g, '').toUpperCase()
          h = '<img class="contain" src="/products/' + sku + '.webp" alt="">'
        } else if (q.get('mode') === 'locked' && q.get('look')) {
          var k = q.get('look').split(',').map(function (s) { return s.trim().toUpperCase().replace(/[^A-Z0-9-]/g, '') }).filter(Boolean).sort().join(',')
          h = NAME + cut(k)
        } else if (q.get('mode') === 'persona' && q.get('video') !== '0') {
          // Brief 10: persona mode is the hero video on a loop (first frame as the instant poster); 3D stays the fallback.
          h = '<video class="vid" src="/brand/hero-walk.mp4" poster="/brand/hero-walk.jpg" autoplay muted loop playsinline preload="auto"></video>'
          keep = true
          p.classList.add('persona')
        } else {
          h = NAME + cut(DEF)
        }
        p.innerHTML = h + '<div class="tag">SHOP-UNI-FY · SETTING THE STAGE</div><div class="bar"></div>'
        var img = p.querySelector('img')
        if (img) { img.onload = function () { img.classList.add('in') }; img.onerror = function () { var fb = img.getAttribute('data-fb'); if (fb && img.src.indexOf(fb) < 0) { img.src = fb } else { img.remove() } }; if (img.complete && img.naturalWidth) img.classList.add('in') }
        var done = false, ready = false
        function hide() { if (done || keep) return; done = true; p.classList.add('gone'); setTimeout(function () { p.remove() }, 900) }
        var vid = p.querySelector('video')
        if (vid) {
          vid.addEventListener('playing', function () { p.classList.add('playing') })
          vid.addEventListener('error', function () {
            keep = false; p.classList.remove('playing')
            p.innerHTML = NAME + cut(DEF) + '<div class="tag">SHOP-UNI-FY · SETTING THE STAGE</div><div class="bar"></div>'
            var im = p.querySelector('img'); if (im) im.onload = function () { im.classList.add('in') }
            if (ready) hide()
          })
        }
        window.addEventListener('stage:ready', function () { ready = true; requestAnimationFrame(function () { requestAnimationFrame(hide) }) })
        window.__hidePoster = hide
        setTimeout(function () { if (!keep) hide() }, 12000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
